<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="17" stitchTiles="stitch" result="fine" />
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="8" stitchTiles="stitch" result="broad" />
    <feComposite in="fine" in2="broad" operator="arithmetic" k1="0" k2="0.75" k3="0.25" k4="0" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncR type="linear" slope="2" intercept="-0.5" />
      <feFuncG type="linear" slope="2" intercept="-0.5" />
      <feFuncB type="linear" slope="2" intercept="-0.5" />
      <feFuncA type="linear" slope="0" intercept="1" />
    </feComponentTransfer>
  </filter>
  <rect width="384" height="384" opacity="1" filter="url(#grain)" />
</svg>
